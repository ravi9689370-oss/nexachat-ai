name: Build NexaChat Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compile Android APK with NexaChat Icon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ubuntu-latest pe SDK preinstalled aata hai — sirf licenses accept karna hai
      - name: Accept Android SDK Licenses (preinstalled SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Install Dependencies & Prepare Web Folder
        run: |
          npm install
          npm run build

      - name: Convert SVG Icon to 1024x1024 PNG for Capacitor Assets
        run: |
          node -e '
            const sharp = require("sharp");
            (async () => {
              await sharp("assets/icon.svg").resize(1024, 1024).png().toFile("assets/icon-only.png");
              await sharp({
                create: { width: 2732, height: 2732, channels: 4, background: { r: 10, g: 10, b: 18, alpha: 1 } }
              }).png().toFile("assets/splash.png");
            })();
          '

      - name: Add & Sync Capacitor Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Auto-Generate & Inject NexaChat App Icon into Android
        run: |
          npx @capacitor/assets generate --android --iconBackgroundColor '#0A0A12' --splashBackgroundColor '#0A0A12'

      - name: Grant Gradle Permissions & Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Sanity Check APK Exists
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build Play Store Bundle (AAB) — best-effort
        run: |
          cd android && ./gradlew bundleRelease || echo "::warning::AAB skip — APK hi main deliverable hai"

      - name: Upload Ready-to-Install Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NexaChat-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Play Store Bundle (AAB)
        uses: actions/upload-artifact@v4
        if: hashFiles('android/app/build/outputs/bundle/release/app-release-unsigned.aab') != ''
        with:
          name: NexaChat-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release-unsigned.aab
